name: Security Assurance (ASVS L2, BOLA & OWASP ZAP)

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-assurance:
    name: Surface Enumeration, Cross-Tenant BOLA & Local DAST
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      CI: "true"
      VITEST_MAX_WORKERS: "2"
      SECURITY_REPORT_DIR: /tmp/punyasitus-security-reports
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Verify security surface enumeration parity
        run: node scripts/security/enumerate-surfaces.mjs --check

      - name: Run security and TASK-078 unit tests
        run: pnpm exec vitest run --config tests/setup/vitest.unit.config.ts --testTimeout=20000 tests/task-078/unit.test.ts tests/security/cross-tenant-bola.unit.test.ts

      - name: Run cross-tenant BOLA workerd integration suite
        run: pnpm exec vitest run --config tests/setup/vitest.integration.config.ts tests/task-078/workerd.integration.test.ts tests/security/workerd.bola.integration.test.ts

      - name: Build platform Worker artifact
        run: pnpm --filter @punyasitus/web build

      - name: Execute local built-Worker HTTP DAST and isolation probes
        run: |
          mkdir -p "$SECURITY_REPORT_DIR"
          node scripts/security/run-security-suite.mjs --skip-vitest --report-out "$SECURITY_REPORT_DIR/local-dast-report.json"

      - name: Upload security assurance reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-assurance-reports
          path: /tmp/punyasitus-security-reports
          retention-days: 14
          if-no-files-found: ignore

  zap-baseline:
    name: OWASP ZAP Baseline Scan (Host-Routed Built Local Worker)
    needs: security-assurance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CI: "true"
      ZAP_TARGET_PORT: "8787"
      ZAP_PERSIST_DIR: /tmp/punyasitus-zap-persist
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build platform Worker artifact for ZAP target
        run: pnpm --filter @punyasitus/web build

      - name: Apply local D1 migrations and boot built Worker
        run: |
          mkdir -p "$ZAP_PERSIST_DIR"
          pnpm --dir apps/web exec wrangler d1 migrations apply punyasitus-platform --local --persist-to "$ZAP_PERSIST_DIR"
          nohup pnpm --dir apps/web exec wrangler dev \
            --config dist/server/wrangler.json \
            --local \
            --ip 127.0.0.1 \
            --port "$ZAP_TARGET_PORT" \
            --persist-to "$ZAP_PERSIST_DIR" \
            --show-interactive-dev-session=false \
            > /tmp/zap-wrangler.log 2>&1 &
          echo "$!" > /tmp/zap-wrangler.pid
          for _ in $(seq 1 60); do
            if curl -fsS -H "Host: app.punyasitus.com" "http://127.0.0.1:${ZAP_TARGET_PORT}/api/health" >/dev/null 2>&1; then
              echo "Local built Worker is ready on http://127.0.0.1:${ZAP_TARGET_PORT}"
              exit 0
            fi
            sleep 1
          done
          echo "Local built Worker failed to start within 60s"
          cat /tmp/zap-wrangler.log
          exit 1

      - name: Run OWASP ZAP Baseline Scan against Host-routed app surface
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: "http://127.0.0.1:8787/auth/login"
          rules_file_name: "scripts/security/zap-rules.tsv"
          cmd_options: '-a -j -z "-config replacer.full_list(0).description=app_host -config replacer.full_list(0).enabled=true -config replacer.full_list(0).matchtype=REQ_HEADER -config replacer.full_list(0).matchstr=Host -config replacer.full_list(0).regex=false -config replacer.full_list(0).replacement=app.punyasitus.com"'
          fail_action: true
          allow_issue_writing: false

      - name: Stop local built Worker
        if: always()
        run: |
          if [ -f /tmp/zap-wrangler.pid ]; then
            kill "$(cat /tmp/zap-wrangler.pid)" >/dev/null 2>&1 || true
          fi

      - name: Upload OWASP ZAP baseline reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: owasp-zap-baseline-report
          path: |
            report_html.html
            report_md.md
            report_json.json
            /tmp/zap-wrangler.log
          retention-days: 14
          if-no-files-found: ignore
